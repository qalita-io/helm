name: Build PostgreSQL Backup Image

# CE DÉPÔT EST PUBLIC, ET ÇA DÉCIDE DU RUNNER. Le groupe de runners self-hosted
# de l'org (Default) interdit les dépôts publics (allows_public_repositories:
# false — vérifié le 2026-08-17, et c'est la bonne posture : un runner
# self-hosted exposé à un dépôt public est le piège de sécurité classique). Un
# `runs-on: [self-hosted, ...]` ici resterait donc en « Waiting for a runner »
# pour toujours. À l'inverse, les minutes hébergées sont GRATUITES sur les
# dépôts publics — le blocage de facturation du compte ne les concerne pas,
# prouvé par les runs verts de « CI: Lint and Test » sur ce même dépôt le jour
# où ce workflow a été écrit.
#
# Chaque architecture se construit NATIVEMENT (règle du parc : jamais de
# QEMU) : ubuntu-latest est amd64, ubuntu-24.04-arm est le runner arm64 hébergé
# — gratuit lui aussi sur les dépôts publics. linux/arm64 est indispensable :
# la prod tourne sur les nœuds pi.
#
# Le tag :18 suit la majeure du client pg_dump embarqué, qui doit rester >= à
# celle du serveur sauvegardé. :18 est MUTABLE et les charts tirent en
# IfNotPresent : un rebuild du même tag n'atteint jamais un nœud qui l'a en
# cache. C'est pourquoi chaque build pousse AUSSI :18-<sha court> — immuable,
# épinglable dans les values d'un environnement pour forcer la reprise d'un
# correctif sans attendre que le cache des nœuds tourne.
on:
  push:
    branches: [main]
    paths:
      - 'images/postgres-backup/**'
      - '.github/workflows/build-postgres-backup-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/qalita/postgres-backup

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (native ${{ matrix.arch }})
        uses: docker/build-push-action@v7.2.0
        with:
          context: images/postgres-backup
          platforms: linux/${{ matrix.arch }}
          push: true
          # provenance produirait un index par architecture et casserait le
          # `imagetools create` du job merge.
          provenance: false
          tags: ${{ env.IMAGE }}:18-${{ matrix.arch }}

  merge:
    name: Merge manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:18 \
            -t "${{ env.IMAGE }}:18-${SHORT_SHA}" \
            ${{ env.IMAGE }}:18-amd64 \
            ${{ env.IMAGE }}:18-arm64

      - name: Verify pushed image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:18
