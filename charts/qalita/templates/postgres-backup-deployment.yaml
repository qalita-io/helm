{{- if and .Values.postgresBackup.enabled .Values.postgresql.enabled }}
{{- /*
  Gardé AUSSI sur postgresql.enabled : ce runner sauvegarde le serveur bitnami
  et référence son Service et son Secret. À l'étape 5 de la migration
  (postgresql.enabled: false), ces objets disparaissent avec le sous-chart —
  sans cette garde, le Deployment restait rendu et son pod se figeait en
  CreateContainerConfigError sur un secret mort. Il vit et meurt avec le
  serveur qu'il sauvegarde, structurellement.
*/}}
# Sauvegarde TRANSITOIRE du serveur bitnami 15.4 actuel — phase 11a de la spec
# d'alignement : « livrer et vérifier le sidecar de sauvegarde AVANT toute
# bascule », parce qu'il n'existe aujourd'hui aucune sauvegarde logique de
# cette base et qu'on ne migre pas une base qui n'en a pas.
#
# Un Deployment SÉPARÉ et non un sidecar injecté dans le pod bitnami
# (`primary.sidecars`) : l'injection redémarrerait le pod de la base de
# production pour ajouter... sa sauvegarde. Ce runner parle au serveur via le
# Service, ne touche à rien, et se retire (enabled: false) une fois la
# migration (phase 11c) terminée — le StatefulSet postgres18 embarque alors le
# même script en sidecar, modèle jobchef/previly.
#
# Le client pg_dump est en majeure 18 (image postgres-backup:18) : pg_dump
# refuse un serveur PLUS RÉCENT que lui, jamais l'inverse. 18 dumpe donc le
# serveur 15.4 actuel, et les archives produites sont précisément le format
# que la restauration en 18 rejouera — les sauvegardes transitoires SONT des
# dumps prêts pour la migration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qalita-postgres-backup
  labels:
    app: qalita-postgres-backup
spec:
  replicas: 1
  # Recreate : deux runners simultanés déposeraient deux archives par cycle et
  # se disputeraient la purge.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qalita-postgres-backup
  template:
    metadata:
      labels:
        app: qalita-postgres-backup
    spec:
      {{- if .Values.dockerregistry.enabled }}
      imagePullSecrets:
        - name: qalita-platform-dockerregistry
      {{- end }}
      containers:
        - name: backup
          image: "{{ .Values.postgresBackup.image.repository }}:{{ .Values.postgresBackup.image.tag }}"
          imagePullPolicy: {{ .Values.postgresBackup.image.pullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          command: ["/bin/sh", "/scripts/backup-script.sh"]
          env:
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: POSTGRES_PORT
              value: "{{ include "qalita.postgresPort" . }}"
            - name: POSTGRES_DB
              value: "{{ .Values.postgresql.global.postgresql.auth.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgresql.global.postgresql.auth.username }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Secret du sous-chart bitnami — ce runner sauvegarde CE
                  # serveur-là, il vit et meurt avec lui.
                  name: "{{ .Release.Name }}-postgresql"
                  key: password
            # /pg15 : les archives du serveur bitnami 15.4 vivent dans leur
            # propre dossier, jamais mêlées à celles du serveur 18 (cf. le
            # commentaire de qalita.postgresBackup.commonEnv). Après la
            # migration, ce dossier reste tel quel comme historique — plus
            # personne ne le purge, sa suppression est un geste d'opérateur.
            - name: S3_BACKUP_PREFIX
              value: {{ printf "%s/pg15" .Values.postgresBackup.s3.prefix | quote }}
            - name: BACKUP_PING_URL
              value: {{ .Values.postgresBackup.pingUrl | quote }}
            {{- include "qalita.postgresBackup.commonEnv" . | nindent 12 }}
          volumeMounts:
            - name: backup-script
              mountPath: /scripts
              readOnly: true
            # emptyDir borné plutôt que la couche writable du conteneur : les
            # archives locales ne comptent pas sur la partition racine du nœud,
            # et le script ne garde de toute façon qu'UNE archive en échec
            # (ménage en tête de cycle). La limite est un filet, pas un budget.
            - name: backup-spool
              mountPath: /tmp/backups
          resources:
            {{- toYaml .Values.postgresBackup.resources | nindent 12 }}
          {{- /*
            PAS de readinessProbe, et c'est délibéré (spec, « Instruit le
            2026-08-16 ») : ici elle serait inoffensive (Deployment sans
            Service) mais le même conteneur devient un sidecar du pod
            PostgreSQL en phase 11c, où une probe COUPERAIT la base. On ne
            donne pas au bloc l'habitude d'en avoir une.
          */}}
      volumes:
        - name: backup-script
          configMap:
            name: qalita-postgres-backup-script
            defaultMode: 0755
        - name: backup-spool
          emptyDir:
            sizeLimit: {{ .Values.postgresBackup.spoolSizeLimit | quote }}
{{- end }}
