{{ if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qalita-worker
  labels:
    app: "{{ .Release.Name }}-worker"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-worker"
      release: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-worker"
        release: {{ .Release.Name }}
      {{- if .Values.forceRedeploy }}
      annotations:
        # Force a rollout on every upgrade (dev environments use mutable image tags).
        rollme: {{ randAlphaNum 5 | quote }}
      {{- end }}
    spec:
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.worker.pvc.enabled }}
      securityContext:
        # The containers run as uid 10001 (user qalita); without fsGroup the
        # mounted PVC belongs to root and every write fails with EACCES.
        fsGroup: 10001
      {{- end }}
      containers:
        - name: cli
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args: ["cat /etc/config/init.sh | /bin/sh; sleep infinity"]
          env:
          {{- include "qalita.timezoneEnv" . | nindent 10 }}
          - name: QALITA_WORKER_NAME
            value: {{ .Values.worker.name }}
          - name: QALITA_WORKER_MODE
            value: {{ .Values.worker.mode }}
          - name: QALITA_WORKER_ENDPOINT
            value: "http://{{ .Release.Name }}-backend-service:3080"
          - name: QALITA_WORKER_TOKEN
            value: {{ .Values.worker.token }}
{{- if .Values.worker.deployment.extraEnv }}
{{ toYaml .Values.worker.deployment.extraEnv | indent 10 }}
{{- end }}
          volumeMounts:
            - name: init-script
              mountPath: /etc/config
{{- if .Values.worker.pvc.enabled }}
            - name: worker-store-pvc
              mountPath: /data
            - name: worker-store-pvc
              # The image runs as the non-root user qalita (uid 10001) since the
              # cli image rework: worker state lives under /home/qalita/.qalita.
              mountPath: /home/qalita/.qalita/
              subPath: ./qalita
{{- end }}
{{- if .Values.worker.privileged }}
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
{{- end }}
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            # The init script runs 'qalita worker login', which writes the worker
            # registration file (~/.qalita/.worker). Do NOT chain with ';': a failed
            # login would then be followed by a 'worker run' whose only symptom is a
            # misleading "can't load data file" further down the logs.
            - |
              if ! cat /etc/config/init.sh | /bin/sh; then
                echo "[qalita] worker init script failed - see the errors above." >&2
                echo "[qalita] 'qalita worker login' did not complete, so the worker is not registered." >&2
                echo "[qalita] Usual causes: invalid or expired QALITA_WORKER_TOKEN, token without the" >&2
                echo "[qalita] Data Engineer role, or backend unreachable at QALITA_WORKER_ENDPOINT." >&2
                exit 1
              fi
              exec qalita worker run
          env:
          {{- include "qalita.timezoneEnv" . | nindent 10 }}
          - name: QALITA_WORKER_NAME
            value: {{ .Values.worker.name }}
          - name: QALITA_WORKER_MODE
            value: {{ .Values.worker.mode }}
          - name: QALITA_WORKER_ENDPOINT
            value: "http://{{ .Release.Name }}-backend-service:3080"
          - name: QALITA_WORKER_TOKEN
            value: {{ .Values.worker.token }}
{{- if .Values.worker.deployment.extraEnv }}
{{ toYaml .Values.worker.deployment.extraEnv | indent 10 }}
{{- end }}
          volumeMounts:
            - name: init-script
              mountPath: /etc/config
{{- if .Values.worker.pvc.enabled }}
            - name: worker-store-pvc
              mountPath: /data
            - name: worker-store-pvc
              # The image runs as the non-root user qalita (uid 10001) since the
              # cli image rework: worker state lives under /home/qalita/.qalita.
              mountPath: /home/qalita/.qalita/
              subPath: ./qalita
{{- end }}
      volumes:
        - name: init-script
          configMap:
            name: "qalita-worker-initscript"
{{- if .Values.worker.pvc.enabled }}
        - name: worker-store-pvc
          persistentVolumeClaim:
            claimName: qalita-worker-store
{{- end }}
{{- if .Values.worker.privileged }}
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
{{- end }}
      {{- if .Values.dockerregistry.enabled }}
      imagePullSecrets:
      - name: qalita-platform-dockerregistry
      {{- end }}
{{ end }}
