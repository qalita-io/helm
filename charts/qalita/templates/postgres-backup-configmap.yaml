{{- if or .Values.postgresBackup.enabled .Values.postgres18.enabled }}
# Script de sauvegarde PostgreSQL — la version DURCIE de previly/helm (PR #16),
# pas celle de jobchef/helm dont elle descend. Les différences ne sont pas du
# style, chacune ferme un incident mesuré :
#
#   - sonde pipefail en SOUS-SHELL : `set -o pipefail 2>/dev/null || true`
#     paraît équivalent et ne l'est pas — `set` est un builtin spécial POSIX,
#     sur un shell sans pipefail (dash) l'échec tue le shell AVANT le `|| true`.
#     Mesuré : le script mourait sur cette ligne même ;
#   - sans pipefail, `pg_dump | gzip` rapporte le code de GZIP, qui réussit
#     même en compressant un flux vide. Mesuré le 2026-08-16 : un pg_dump 15
#     contre un serveur 18 avorte sur « server version mismatch », et le script
#     loggait « Backup created successfully » en expédiant 20 octets sur S3 ;
#   - plancher de taille MIN_BACKUP_BYTES : seule garde qui survit à un shell
#     sans pipefail. Un gzip vide fait 20 octets ; le plus petit dump réel de
#     cette base est trois ordres de grandeur au-dessus ;
#   - la purge de rétention n'est JAMAIS lancée si le dépôt S3 a échoué : sept
#     jours d'archives vides effaceraient les sept dernières valides ;
#   - ping healthchecks.io best-effort : si le conteneur cesse de tourner
#     (éviction, scale 0), aucun ping ne part et le check sonne de lui-même.
#     Rien d'autre dans ce cluster ne surveille ces sauvegardes
#     (`kubectl get prometheusrules -A | grep -ci backup` rend 0) ;
#   - `--output text` de l'AWS CLI rend les clés séparées par des TABULATIONS
#     sur une seule ligne : le `tr '\t' '\n'` avant le `while read` n'est pas
#     décoratif, sans lui la purge ne voyait qu'une pseudo-clé géante.
#
# Le script est piloté par variables d'environnement : le MÊME ConfigMap sert
# au Deployment transitoire (qui sauvegarde le serveur bitnami 15.4 actuel via
# le Service) et au sidecar du StatefulSet postgres18 (qui parle à localhost).
apiVersion: v1
kind: ConfigMap
metadata:
  name: qalita-postgres-backup-script
data:
  backup-script.sh: |
    #!/bin/sh
    set -e
    if (set -o pipefail) 2>/dev/null; then
      set -o pipefail
    fi

    POSTGRES_HOST="${POSTGRES_HOST:-localhost}"
    POSTGRES_PORT="${POSTGRES_PORT:-5432}"
    POSTGRES_DB="${POSTGRES_DB:?POSTGRES_DB est obligatoire}"
    POSTGRES_USER="${POSTGRES_USER:?POSTGRES_USER est obligatoire}"
    : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}"

    S3_ENDPOINT="${S3_BACKUP_ENDPOINT:?S3_BACKUP_ENDPOINT est obligatoire}"
    S3_BUCKET="${S3_BACKUP_BUCKET:?S3_BACKUP_BUCKET est obligatoire}"
    S3_PREFIX="${S3_BACKUP_PREFIX:-}"
    export AWS_ACCESS_KEY_ID="${S3_BACKUP_ACCESS_KEY_ID:?}"
    export AWS_SECRET_ACCESS_KEY="${S3_BACKUP_SECRET_ACCESS_KEY:?}"
    export AWS_DEFAULT_REGION="${S3_BACKUP_REGION:-gra}"

    BACKUP_SCHEDULE="${BACKUP_SCHEDULE:-0 2 * * *}"
    RETENTION_DAYS="${RETENTION_DAYS:-30}"
    MIN_BACKUP_BYTES="${MIN_BACKUP_BYTES:-1024}"
    BACKUP_PING_URL="${BACKUP_PING_URL:-}"
    BACKUP_DIR="/tmp/backups"

    if [ -n "${S3_PREFIX}" ]; then
      S3_PATH="${S3_BUCKET}/${S3_PREFIX}"
      LIST_PREFIX="${S3_PREFIX}/backup_${POSTGRES_DB}_"
    else
      S3_PATH="${S3_BUCKET}"
      LIST_PREFIX="backup_${POSTGRES_DB}_"
    fi

    mkdir -p "${BACKUP_DIR}"

    ping_hc() {
      [ -n "${BACKUP_PING_URL}" ] || return 0
      command -v curl > /dev/null 2>&1 || return 0
      curl -fsS -m 10 --retry 3 -o /dev/null "${BACKUP_PING_URL}$1" \
        --data-raw "$2" 2>/dev/null || true
    }

    wait_for_postgres() {
      echo "Attente de PostgreSQL (${POSTGRES_HOST}:${POSTGRES_PORT})..."
      until PGPASSWORD="${POSTGRES_PASSWORD}" pg_isready \
        -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" \
        -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" > /dev/null 2>&1; do
        sleep 5
      done
      echo "PostgreSQL est prêt."
    }

    # Le bucket est provisionné à la main (OVH) : on ne le crée pas, on vérifie
    # qu'il répond. Sans lui, échouer bruyamment tout de suite vaut mieux que
    # découvrir le trou le jour de la restauration.
    check_bucket() {
      if aws s3api head-bucket --bucket "${S3_BUCKET}" \
        --endpoint-url "${S3_ENDPOINT}" > /dev/null 2>&1; then
        echo "Bucket ${S3_BUCKET} joignable."
      else
        echo "Erreur : bucket ${S3_BUCKET} injoignable sur ${S3_ENDPOINT}" >&2
        echo "(identifiants, région ou nom de bucket)" >&2
        exit 1
      fi
    }

    create_backup() {
      TIMESTAMP=$(date +%Y%m%d_%H%M%S)
      BACKUP_FILE="${BACKUP_DIR}/backup_${POSTGRES_DB}_${TIMESTAMP}.sql.gz"
      echo "Dump vers ${BACKUP_FILE}" >&2

      # Testé par `if !`, jamais par un `$?` après coup : dans un pipeline `$?`
      # porte le code de la DERNIÈRE commande. pipefail fait échouer le
      # pipeline ; ce `if` est ce qui le lit.
      if ! PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
        -h "${POSTGRES_HOST}" -p "${POSTGRES_PORT}" \
        -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
        --no-owner --no-acl \
        | gzip > "${BACKUP_FILE}"; then
        echo "Erreur : pg_dump a échoué, ${BACKUP_FILE} jeté" >&2
        rm -f "${BACKUP_FILE}"
        return 1
      fi

      BACKUP_BYTES=$(wc -c < "${BACKUP_FILE}")
      if [ "${BACKUP_BYTES}" -lt "${MIN_BACKUP_BYTES}" ]; then
        echo "Erreur : archive de ${BACKUP_BYTES} octets, sous le plancher de ${MIN_BACKUP_BYTES} — refusée" >&2
        rm -f "${BACKUP_FILE}"
        return 1
      fi

      echo "Archive créée : ${BACKUP_FILE} (${BACKUP_BYTES} octets)" >&2
      echo "${BACKUP_FILE}"
    }

    upload_to_s3() {
      backup_file="$1"
      object_name="$(basename "${backup_file}")"
      echo "Envoi de ${backup_file} vers s3://${S3_PATH}/${object_name}"
      if aws s3 cp "${backup_file}" "s3://${S3_PATH}/${object_name}" \
        --endpoint-url "${S3_ENDPOINT}"; then
        rm -f "${backup_file}"
        return 0
      fi
      return 1
    }

    clean_old_backups() {
      # `date -d "N days ago"` est une extension GNU absente du busybox
      # d'Alpine : la coupure se calcule en epoch.
      CUTOFF_EPOCH=$(( $(date -u +%s) - RETENTION_DAYS * 86400 ))
      CUTOFF_DATE=$(date -u -d "@${CUTOFF_EPOCH}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)
      if [ -z "${CUTOFF_DATE}" ]; then
        echo "Avertissement : coupure incalculable, purge sautée" >&2
        return 0
      fi
      echo "Purge des archives antérieures à ${CUTOFF_DATE}"
      aws s3api list-objects-v2 \
        --bucket "${S3_BUCKET}" \
        --prefix "${LIST_PREFIX}" \
        --endpoint-url "${S3_ENDPOINT}" \
        --query "Contents[?LastModified<='${CUTOFF_DATE}'].Key" \
        --output text 2>/dev/null | tr '\t' '\n' | while read -r key; do
          if [ -n "${key}" ] && [ "${key}" != "None" ]; then
            echo "Suppression de ${key}"
            aws s3 rm "s3://${S3_BUCKET}/${key}" --endpoint-url "${S3_ENDPOINT}" || true
          fi
        done
    }

    run_cycle() {
      # `set -e` + VAR=$(fonction) : si la fonction échoue, le shell SORT sur
      # l'affectation. L'envelopper dans un `if` neutralise ce piège — mesuré,
      # la première version du correctif previly mettait le sidecar en
      # crash-loop exactement ici.
      if BACKUP_FILE=$(create_backup); then
        if upload_to_s3 "${BACKUP_FILE}"; then
          # Le ping part AVANT la purge : une purge lente sur un gros backlog
          # ne doit pas faire sonner l'alarme d'un cycle pourtant réussi.
          ping_hc "" "sauvegarde deposee"
          clean_old_backups
        else
          echo "Erreur : envoi S3 en échec — archive locale conservée, PURGE SAUTÉE" >&2
          ping_hc "/fail" "envoi S3 en echec"
        fi
      else
        echo "Erreur : cycle de sauvegarde en échec" >&2
        ping_hc "/fail" "pg_dump en echec"
      fi
    }

    # Seuls minute et heure du cron sont interprétés — un passage par jour.
    seconds_until_next_run() {
      CRON_MINUTE=$(echo "${BACKUP_SCHEDULE}" | cut -d' ' -f1)
      CRON_HOUR=$(echo "${BACKUP_SCHEDULE}" | cut -d' ' -f2)
      # Les zéros de tête sont lus comme de l'octal invalide par $(( )).
      CRON_MINUTE=$(echo "${CRON_MINUTE#0}" | sed 's/^$/0/')
      CRON_HOUR=$(echo "${CRON_HOUR#0}" | sed 's/^$/0/')
      NOW_HOUR=$(date +%H); NOW_HOUR=$(echo "${NOW_HOUR#0}" | sed 's/^$/0/')
      NOW_MINUTE=$(date +%M); NOW_MINUTE=$(echo "${NOW_MINUTE#0}" | sed 's/^$/0/')
      NOW_SECOND=$(date +%S); NOW_SECOND=$(echo "${NOW_SECOND#0}" | sed 's/^$/0/')
      TARGET=$((CRON_HOUR * 3600 + CRON_MINUTE * 60))
      NOW=$((NOW_HOUR * 3600 + NOW_MINUTE * 60 + NOW_SECOND))
      if [ ${TARGET} -gt ${NOW} ]; then
        echo $((TARGET - NOW))
      else
        echo $((86400 - NOW + TARGET))
      fi
    }

    echo "Sauvegarde PostgreSQL démarrée — ${BACKUP_SCHEDULE}, rétention ${RETENTION_DAYS} j"
    echo "Destination : s3://${S3_PATH} (${S3_ENDPOINT})"

    wait_for_postgres
    check_bucket

    # Une première sauvegarde au démarrage : un pod qui vient de rouler ne doit
    # pas attendre la nuit suivante pour avoir un point de restauration.
    run_cycle

    while true; do
      WAIT=$(seconds_until_next_run)
      echo "Prochaine sauvegarde dans $((WAIT / 3600))h $((WAIT % 3600 / 60))m"
      sleep "${WAIT}"
      run_cycle
    done
{{- end }}
