{{- if or .Values.postgresBackup.enabled (and .Values.postgres18.enabled .Values.postgres18.backup.enabled) }}
{{- /*
  Identifiants S3 des sauvegardes PostgreSQL, via `qalita.preservedSecret`
  (templates/_helpers.tpl) : valeur fournie, sinon valeur déjà en cluster,
  sinon ÉCHEC — jamais de génération. Comme pour seaweedfs-s3-secret : ces clés
  doivent être connues du fournisseur de stockage (OVH), en fabriquer une au
  hasard produirait un déploiement « réussi » qui ne sauvegarde rien. Un
  déploiement incapable de produire une valeur valide s'arrête bruyamment.
*/}}
{{- $ak := include "qalita.preservedSecret" (dict "ctx" $ "secret" "qalita-postgres-backup-s3" "key" "access_key_id"     "value" .Values.postgresBackup.s3.accessKeyId) }}
{{- $sk := include "qalita.preservedSecret" (dict "ctx" $ "secret" "qalita-postgres-backup-s3" "key" "secret_access_key" "value" .Values.postgresBackup.s3.secretAccessKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: qalita-postgres-backup-s3
stringData:
  access_key_id: {{ $ak | quote }}
  secret_access_key: {{ $sk | quote }}
{{- end }}
