apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-backend"
  labels:
    app: "{{ .Release.Name }}-backend"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
{{ include "qalita.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-backend"
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-backend"
        release: {{ .Release.Name }}
      {{- if .Values.forceRedeploy }}
      annotations:
        # Force a rollout on every upgrade (dev environments use mutable image tags).
        rollme: {{ randAlphaNum 5 | quote }}
      {{- end }}
    spec:
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: "backend"
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        startupProbe:
          exec:
            command:
            - /app/liveness_check.sh
          initialDelaySeconds: {{ .Values.backend.startupProbe.initialDelaySeconds | default 10 }}
          periodSeconds: {{ .Values.backend.startupProbe.periodSeconds | default 10 }}
          failureThreshold: {{ .Values.backend.startupProbe.failureThreshold | default 10 }}
          timeoutSeconds: {{ .Values.backend.startupProbe.timeoutSeconds | default 5 }}
        livenessProbe:
          exec:
            command:
            - /app/liveness_check.sh
          initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds | default 10 }}
          periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds | default 60 }}
          failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold | default 3 }}
          timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds | default 15 }}
        env:
          {{- /*
            La bascule PostgreSQL 15 -> 18 (phase 11c) est un REPOINTAGE, pas un
            redéploiement de base : `postgres18.serveApp: true` fait viser le
            StatefulSet maison (service et secret qalita-postgres18) au lieu du
            sous-chart bitnami. Le retour arrière est le même booléen dans
            l'autre sens — l'ancien serveur reste en place, volume intact,
            comme la spec l'exige. Base et utilisateur ne changent pas de nom
            d'un serveur à l'autre : seuls l'hôte et la source du mot de passe
            bougent.
          */}}
          {{- $pgHost := printf "%s-postgresql" .Release.Name }}
          {{- $pgSecret := printf "%s-postgresql" .Release.Name }}
          {{- if and .Values.postgres18.enabled .Values.postgres18.serveApp }}
          {{- $pgHost = "qalita-postgres18" }}
          {{- $pgSecret = "qalita-postgres18" }}
          {{- end }}
          - name: POSTGRESQL_SERVER
            value: {{ $pgHost | quote }}
          - name: POSTGRESQL_PORT
            value: "{{ include "qalita.postgresPort" . }}"
          - name: POSTGRESQL_DATABASE
            value: "{{ .Values.postgresql.global.postgresql.auth.database }}"
          - name: POSTGRESQL_USERNAME
            value: "{{ .Values.postgresql.global.postgresql.auth.username }}"
          - name: POSTGRESQL_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: {{ $pgSecret | quote }}
                optional: false
        {{- if .Values.backend.mail.enabled }}
          - name: MAIL_USERNAME
            value: "{{ .Values.backend.mail.username }}"
          - name: MAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                key: mail-password
                name: "qalita-mailcreds"
                optional: false
          - name: MAIL_FROM
            value: "{{ .Values.backend.mail.from }}"
          - name: MAIL_FROM_NAME
            value: "{{ .Values.backend.mail.from_name }}"
          - name: MAIL_PORT
            value: "{{ .Values.backend.mail.port }}"
          - name: MAIL_SERVER
            value: "{{ .Values.backend.mail.server }}"
          - name: MAIL_STARTTLS
            value: "{{ .Values.backend.mail.starttls }}"
          - name: MAIL_SSL_TLS
            value: "{{ .Values.backend.mail.ssl_tls }}"
        {{- end }}
          - name: QALITA_ENV
            value: "{{ .Values.backend.mode }}"
          - name: QALITA_ACCESS_TOKEN_EXPIRE_MINUTES
            value: "{{ .Values.backend.AUTHTokenExpireMinutes }}"
          - name: QALITA_RETENTION_LOG_HOURS
            value: "{{ .Values.backend.RetentionLogsHours }}"
          - name: QALITA_API_TOKEN_EXPIRE_MINUTES
            value: "{{ .Values.backend.APItokenExpireMinutes }}"
          - name: QALITA_ORGANIZATION_NAME
            value: "{{ .Values.backend.organization.name }}"
          - name: QALITA_API_PORT
            value: "{{ .Values.backend.api.port }}"
          - name: QALITA_API_HOST
            value: "{{ .Values.backend.api.host }}"
          - name: QALITA_API_WORKER
            value: "{{ .Values.backend.api.worker }}"
          - name: QALITA_API_TIMEOUT
            value: "{{ .Values.backend.api.timeout | default 120 }}"
          - name: QALITA_ADMIN_USERNAME
            value: "{{ .Values.backend.adminUsername }}"
          - name: QALITA_ALGORITHM
            value: "{{ .Values.backend.secretKeyAlgorithm }}"
          - name: QALITA_INIT_SLEEP
            value: "{{ .Values.backend.iniSleep }}"
          - name: QALITA_PUBLIC_PLATFORM_URL
            value: "https://{{ .Values.cluster.domain }}"
          - name: QALITA_PUBLIC_API_URL
            value: "https://api.{{ .Values.cluster.domain }}"
          - name: QALITA_PUBLIC_DOC_URL
            value: "{{ .Values.backend.publicDocUrl | default (printf "https://doc.%s" .Values.cluster.domain) }}"
          - name: QALITA_S3_URL
            value: "{{ .Values.backend.s3.url }}"
          - name: QALITA_AUTH_MODE
            value: "{{ .Values.backend.authMode }}"
          - name: QALITA_S3_KEY_ID
            valueFrom:
              secretKeyRef:
                key: admin_access_key_id
                name: {{ .Values.backend.s3.secretName }}
                optional: false
          - name: QALITA_S3_KEY_SECRET
            valueFrom:
              secretKeyRef:
                key: admin_secret_access_key
                name: {{ .Values.backend.s3.secretName }}
                optional: false
          - name: QALITA_S3_READER_KEY_ID
            valueFrom:
              secretKeyRef:
                key: read_access_key_id
                name: {{ .Values.backend.s3.secretName }}
                optional: false
          - name: QALITA_S3_READER_KEY_SECRET
            valueFrom:
              secretKeyRef:
                key: read_secret_access_key
                name: {{ .Values.backend.s3.secretName }}
                optional: false
          - name: QALITA_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                key: adminPassword
                name: "{{ .Release.Name }}-qalita-secret"
                optional: false
          - name: QALITA_SECRET_KEY
            valueFrom:
              secretKeyRef:
                key: secretKey
                name: "{{ .Release.Name }}-qalita-secret"
                optional: false
          - name: QALITA_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                key: licenseKey
                name: "{{ .Release.Name }}-qalita-secret"
                optional: false
          - name: QALITA_LICENSE_USER
            value: "{{ .Values.licenseUser }}"
        {{- if .Values.backend.caBundle.existingSecret }}
          - name: QALITA_CA_CERTS_DIR
            value: "{{ .Values.backend.caBundle.mountPath }}"
        {{- end }}
{{- if .Values.backend.deployment.extraEnv }}
{{ toYaml .Values.backend.deployment.extraEnv | indent 10 }}
{{- end }}
{{- if or .Values.backend.caBundle.existingSecret .Values.backend.deployment.extraVolumeMounts }}
        volumeMounts:
        {{- if .Values.backend.caBundle.existingSecret }}
          - name: ca-certificates
            mountPath: "{{ .Values.backend.caBundle.mountPath }}"
            readOnly: true
        {{- end }}
{{- if .Values.backend.deployment.extraVolumeMounts }}
{{ toYaml .Values.backend.deployment.extraVolumeMounts | indent 10 }}
{{- end }}
{{- end }}
        ports:
          - containerPort: {{ .Values.backend.service.targetPort }}
            name: rest
            protocol: {{ .Values.backend.service.protocol }}
          {{- if .Values.backend.grpc.enabled }}
          - containerPort: {{ .Values.backend.grpc.port }}
            name: grpc
            protocol: {{ .Values.backend.grpc.protocol }}
          {{- end }}
{{- if .Values.backend.deployment.resources }}
        resources:
{{ toYaml .Values.backend.deployment.resources | indent 10 }}
{{- end }}
{{- if or .Values.backend.caBundle.existingSecret .Values.backend.deployment.extraVolumes }}
      volumes:
        {{- if .Values.backend.caBundle.existingSecret }}
        - name: ca-certificates
          secret:
            secretName: "{{ .Values.backend.caBundle.existingSecret }}"
        {{- end }}
{{- if .Values.backend.deployment.extraVolumes }}
{{ toYaml .Values.backend.deployment.extraVolumes | indent 8 }}
{{- end }}
{{- end }}
      {{- if .Values.dockerregistry.enabled }}
      imagePullSecrets:
      - name: qalita-platform-dockerregistry
      {{- end }}
