apiVersion: v2
description: Helm chart for QALITA Platform, a platform for managing and monitoring your data quality.
name: "qalita"
# MAJEURE — phase 11 de la spec d'alignement : l'API publique du chart change.
# Nouveau bloc de values `postgres18` : serveur maison, côte-à-côte avec le
# sous-chart bitnami que ce chart quittera en fin de phase 11c, bascule et
# retour arrière par `postgres18.serveApp`. Pas de sauvegarde logique planifiée
# (décision propriétaire 2026-08-17 : couverture Longhorn, restauration
# exercée). Le schéma de values et les notes de migration sont dans
# values.schema.json et README.md.
version: "3.0.0"
icon: https://avatars.githubusercontent.com/u/101010687?s=48&v=4
appVersion: "2.18.0"
home: https://qalita.io
kubeVersion: ">= 1.24.0-0"
type: application
keywords:
  - cloud-native
  - data-quality
dependencies:
  - name: postgresql
    repository: https://charts.bitnami.com/bitnami
    version: 12.12.10
    condition: postgresql.enabled
  - name: seaweedfs
    repository: https://seaweedfs.github.io/seaweedfs/helm
    # 4.41.0 est la version de CHART ; elle livre l'appVersion 4.41, qui est
    # ce que vise le socle. Les deux numéros se ressemblent sans être le même
    # objet.
    version: 4.41.0
    condition: seaweedfs.enabled
maintainers:
  - name: qalita
    email: contact@qalita.io
    url: https://qalita.io
