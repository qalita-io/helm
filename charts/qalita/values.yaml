# For private GHCR images: set to a GitHub username (or token username) and PAT with read:packages.
licenseUser: "unlicenced"
licenseKey: "unlicenced"
# Docker registry hostname for imagePullSecret (.dockerconfigjson "auths" key). Use ghcr.io for GitHub Container Registry.
licenseUrl: ghcr.io

cluster:
  issuer: letsencrypt-prod
  domain: example.com
  name: local

# Adds a random rollme annotation to pods: every helm upgrade forces a rollout.
# Enable only on environments tracking mutable image tags (e.g. :dev).
forceRedeploy: false

dockerregistry:
  enabled: true
  deploySecret: true

frontend:
  image:
    repository: ghcr.io/qalita/platform-frontend
    tag: "2.16.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  telemetryDisabled: "1"
  webPackPolling: "false"
  mode: "production"

  service:
    type: ClusterIP
    targetPort: "3000"
    protocol: TCP

  ingress:
    enabled: true
    tls:
      enabled: true

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "50m"

    extraEnv: []

doc:
  enabled: true
  image:
    repository: ghcr.io/qalita/documentation
    tag: "2.13.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    targetPort: "80"
    protocol: TCP

  ingress:
    enabled: true
    tls:
      enabled: true

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "50m"

backend:
  image:
    repository: ghcr.io/qalita/platform-backend
    tag: "2.16.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  organization:
    name: "local"

  RetentionLogsHours: 720
  AUTHTokenExpireMinutes: 240
  APItokenExpireMinutes: 525600
  mode: "PROD"
  iniSleep: "3"

  authMode: "table"
  adminUsername: "admin"
  adminPassword:
  secretKey:
  secretKeyAlgorithm: "HS256"

  mail:
    enabled: false
    username: ""
    password: ""
    from: "no-reply@example.com"
    from_name: "QALITA Platform"
    port: 1025
    server: ""
    starttls: false
    ssl_tls: false

  s3:
    url: "http://seaweedfs-s3:8333"
    secretName: seaweedfs-s3-secret
    admin_access_key_id: ""
    admin_secret_access_key: ""
    read_access_key_id: ""
    read_secret_access_key: ""

  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5

  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 60
    failureThreshold: 3
    timeoutSeconds: 15

  api:
    port: "3080"
    host: "0.0.0.0"
    worker: 4
    timeout: 120

  service:
    type: ClusterIP
    targetPort: "3080"
    protocol: TCP

  grpc:
    enabled: true
    port: 50051
    protocol: TCP
    ingress:
      enabled: false
      tls:
        enabled: true
      annotations: {}

  ingress:
    enabled: true
    tls:
      enabled: true

  # Extra CA certificates trusted for outbound TLS: private LLM endpoint,
  # TLS-intercepting proxy, internal PKI. Create a Secret whose keys are PEM
  # files named *.crt or *.pem, then set existingSecret:
  #   kubectl create secret generic qalita-ca-bundle \
  #     --from-file=chu-root.crt --from-file=chu-intermediate.crt
  # They are merged with the public CA bundle at container startup, so public
  # CAs stay trusted (license registry, Stripe, cloud LLM providers).
  caBundle:
    existingSecret: ""
    mountPath: /etc/qalita/ca-certificates

  deployment:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "4Gi"
        cpu: "1000m"

    extraEnv: []
    extraVolumes: []
    extraVolumeMounts: []

worker:
  enabled: false
  privileged: false
  name: "worker"
  mode: "worker"
  token: "changeme"

  image:
    # Repo renamed qalita-cli -> cli on 2026-07-12; this default stays pinned
    # to the legacy ghcr.io/qalita/qalita-cli package (prod-stable release)
    # until the first tagged release exists under ghcr.io/qalita/cli.
    repository: ghcr.io/qalita/qalita-cli
    tag: "2.13.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  pvc:
    enabled: false
    storageSize: "10Gi"

  initscript: |
    #!/bin/bash
    echo "Worker agent starting..."
    qalita worker login

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "10m"

    extraEnv: []

postgresql:
  enabled: true
  image:
    registry: ghcr.io/qalita
    repository: postgresql
    pullSecrets:
      - "qalita-platform-dockerregistry"
    tag: "15.4.0"

  global:
    postgresql:
      auth:
        database: qalitadb
        username: qalita
        password:

  primary:
    persistence:
      size: 8Gi

  backup:
    enabled: false
    cronjob:
      storage:
        resourcePolicy: "keep"

seaweedfs:
  enabled: true

  global:
    createClusterRole: true
    serviceAccountName: "seaweedfs"
    registry: ghcr.io/qalita
    repository: seaweedfs
    imagePullSecrets: "qalita-platform-dockerregistry"
    imageName: seaweedfs

  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: "seaweedfs-s3-secret"

  filer:
    data:
      type: "persistentVolumeClaim"
      size: "4Gi"

    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: "seaweedfs-s3-secret"

    resources:
      requests:
        memory: "100Mi"
        cpu: "50m"

  volume:
    dataDirs:
      - name: data1
        type: "persistentVolumeClaim"
        size: "32Gi"
        maxVolumes: 0

    resources:
      requests:
        memory: "100Mi"
        cpu: "50m"

  master:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"

redirect:
  enabled: false

# HTTP to HTTPS redirect configuration
httpRedirect:
  enabled: false
  frontend:
    enabled: true
    annotations: {}
  api:
    enabled: true
    annotations: {}
  doc:
    enabled: true
    annotations: {}

helmsync:
  enabled: false
  image:
    repository: alpine/helm

  kubeconfig: |-
    apiVersion: v1
    kind: Config
    clusters:
    - name: "<kubernetes_cluster_name>"
      cluster:
        server: "<kubernetes_api_server_url>"
    users:
    - name: "<kubernetes_cluster_name>-user"
      user:
        token: "<kubernetes_cluster_token>"
    contexts:
    - name: "<kubernetes_cluster_name>-context"
      context:
        user: "<kubernetes_cluster_name>-user"
        cluster: "<kubernetes_cluster_name>"
    current-context: "<kubernetes_cluster_name>-context"

  resources:
    requests:
      memory: "50Mi"
      cpu: "10m"
