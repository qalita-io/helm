# For private GHCR images: set to a GitHub username (or token username) and PAT with read:packages.
licenseUser: "unlicenced"
licenseKey: "unlicenced"
# Docker registry hostname for imagePullSecret (.dockerconfigjson "auths" key). Use ghcr.io for GitHub Container Registry.
licenseUrl: ghcr.io

cluster:
  issuer: letsencrypt-prod
  domain: example.com
  name: local

# Adds a random rollme annotation to pods: every helm upgrade forces a rollout.
# Enable only on environments tracking mutable image tags (e.g. :dev).
forceRedeploy: false

dockerregistry:
  enabled: true
  deploySecret: true

frontend:
  image:
    repository: ghcr.io/qalita/platform-frontend
    tag: "2.18.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  telemetryDisabled: "1"
  webPackPolling: "false"
  mode: "production"

  service:
    type: ClusterIP
    targetPort: "3000"
    protocol: TCP

  ingress:
    enabled: true
    tls:
      enabled: true

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "50m"

    extraEnv: []

doc:
  enabled: true
  image:
    repository: ghcr.io/qalita/documentation
    tag: "2.18.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    targetPort: "80"
    protocol: TCP

  ingress:
    enabled: true
    tls:
      enabled: true

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "50m"

backend:
  image:
    repository: ghcr.io/qalita/platform-backend
    tag: "2.18.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  organization:
    name: "local"

  RetentionLogsHours: 720
  AUTHTokenExpireMinutes: 240
  APItokenExpireMinutes: 525600
  mode: "PROD"
  iniSleep: "3"

  authMode: "table"
  adminUsername: "admin"
  adminPassword:
  secretKey:
  secretKeyAlgorithm: "HS256"

  mail:
    enabled: false
    username: ""
    password: ""
    from: "no-reply@example.com"
    from_name: "QALITA Platform"
    port: 1025
    server: ""
    starttls: false
    ssl_tls: false

  s3:
    url: "http://seaweedfs-s3:8333"
    secretName: seaweedfs-s3-secret
    admin_access_key_id: ""
    admin_secret_access_key: ""
    read_access_key_id: ""
    read_secret_access_key: ""

  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5

  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 60
    failureThreshold: 3
    timeoutSeconds: 15

  api:
    port: "3080"
    host: "0.0.0.0"
    worker: 4
    timeout: 120

  service:
    type: ClusterIP
    targetPort: "3080"
    protocol: TCP

  grpc:
    enabled: true
    port: 50051
    protocol: TCP
    ingress:
      enabled: false
      tls:
        enabled: true
      annotations: {}

  ingress:
    enabled: true
    tls:
      enabled: true

  # Extra CA certificates trusted for outbound TLS: private LLM endpoint,
  # TLS-intercepting proxy, internal PKI. Create a Secret whose keys are PEM
  # files named *.crt or *.pem, then set existingSecret:
  #   kubectl create secret generic qalita-ca-bundle \
  #     --from-file=chu-root.crt --from-file=chu-intermediate.crt
  # They are merged with the public CA bundle at container startup, so public
  # CAs stay trusted (license registry, Stripe, cloud LLM providers).
  caBundle:
    existingSecret: ""
    mountPath: /etc/qalita/ca-certificates

  deployment:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "4Gi"
        cpu: "1000m"

    extraEnv: []
    extraVolumes: []
    extraVolumeMounts: []

worker:
  enabled: false
  privileged: false
  name: "worker"
  mode: "worker"
  token: "changeme"

  image:
    # Repo renamed qalita-cli -> cli on 2026-07-12. Releases now ship under
    # ghcr.io/qalita/cli (first one 2.16.4), which is also what the client
    # registry mirrors, so the default follows the current package.
    repository: ghcr.io/qalita/cli
    tag: "2.18.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  pvc:
    enabled: false
    storageSize: "10Gi"

  initscript: |
    #!/bin/bash
    echo "Worker agent starting..."
    qalita worker login

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "10m"

    extraEnv: []

postgresql:
  enabled: true
  image:
    registry: ghcr.io/qalita
    repository: postgresql
    pullSecrets:
      - "qalita-platform-dockerregistry"
    tag: "15.4.0"

  global:
    postgresql:
      auth:
        database: qalitadb
        username: qalita
        password:

  primary:
    persistence:
      size: 8Gi

  # Clé du sous-chart BITNAMI, jamais câblée à rien de fonctionnel dans ce
  # chart (aucune sauvegarde logique n'a jamais existé sur ces bases — spec
  # d'alignement, phase 11). Conservée uniquement parce que le sous-chart la
  # lit ; la vraie sauvegarde est `postgresBackup` ci-dessous.
  backup:
    enabled: false
    cronjob:
      storage:
        resourcePolicy: "keep"

# Sauvegarde logique PostgreSQL — phase 11a de la spec d'alignement, livrée
# AVANT la migration 15 -> 18 parce qu'on ne migre pas une base qui n'a aucune
# sauvegarde. `enabled` gouverne le Deployment TRANSITOIRE qui dumpe le serveur
# bitnami 15.4 actuel via son Service ; le bloc s3/schedule/retention sert
# aussi au sidecar du StatefulSet postgres18 (postgres18.backup.enabled), même
# script, même image, même bucket.
postgresBackup:
  enabled: false
  image:
    # Construite par .github/workflows/build-postgres-backup-image.yml
    # (runners self-hosted natifs, amd64+arm64). Le client pg_dump est en 18 :
    # il dumpe aussi bien le serveur 15.4 actuel que le serveur 18 cible —
    # pg_dump ne refuse que les serveurs PLUS RÉCENTS que lui. Le tag :18 est
    # OBLIGATOIRE, pas préférable (cf. images/postgres-backup/Dockerfile).
    repository: ghcr.io/qalita/postgres-backup
    tag: "18"
    pullPolicy: IfNotPresent
  schedule: "0 2 * * *"
  # 30 et non 7 : même arbitrage que previly/helm — dès que la purge marche
  # vraiment, la rétention déclarée devient réelle, et 7 jours est trop court
  # pour survivre à des vacances.
  retentionDays: 30
  # Plancher de taille : un gzip d'un flux vide fait 20 octets ; le plus petit
  # dump réel de ces bases est trois ordres de grandeur au-dessus. Seule garde
  # qui survivrait à un shell sans pipefail.
  minBytes: 1024
  # URL healthchecks.io (vide = pas de ping). Déposée au déploiement depuis
  # Infisical, jamais dans ce fichier.
  pingUrl: ""
  s3:
    # Stockage objet HORS cluster (OVH) — sauvegarder vers le SeaweedFS du
    # même cluster ne serait pas une sauvegarde.
    endpoint: ""
    bucket: ""
    prefix: "postgresql-backups"
    region: "gra"
    # Déposés au déploiement (Infisical). Vides ici : qalita.preservedSecret
    # réutilise la valeur déjà en cluster, et ÉCHOUE au premier déploiement si
    # rien n'est fourni — jamais de secret vide écrit, jamais de généré.
    accessKeyId: ""
    secretAccessKey: ""
  resources:
    requests:
      memory: "64Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"

# PostgreSQL 18 maison — phase 11 : sortie du sous-chart bitnami. Côte-à-côte
# avec lui : propre StatefulSet, Service, secret et volume, il ne touche à rien
# de ce que bitnami possède. Séquence de migration (phase 11c) :
#   1. postgres18.enabled: true          -> le serveur 18 démarre, vide
#   2. dump/restore (jamais pg_upgrade)  -> depuis une archive postgresBackup
#   3. postgres18.serveApp: true         -> le backend bascule (repointage)
#   4. sous-chart bitnami à l'échelle 0, volume INTACT plusieurs jours
#   5. postgresql.enabled: false         -> seulement après période nominale
# Retour arrière à toute étape : serveApp false — l'ancien serveur n'a jamais
# bougé.
postgres18:
  enabled: false
  # true = le backend vise qalita-postgres18 (service et secret) au lieu du
  # sous-chart bitnami. C'est LA bascule, et c'est aussi le retour arrière.
  serveApp: false
  image:
    # Miroir GHCR de library/postgres:18-alpine (mirror-images.yml) — la
    # décision de source que mirror-images.yml renvoyait « au chantier
    # PostgreSQL dédié » est ici : l'image officielle, pas bitnami, comme
    # jobchef et previly.
    repository: ghcr.io/qalita/postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  auth:
    # Vide = généré au premier déploiement puis préservé
    # (qalita.preservedSecret). Rotation : ALTER ROLE d'abord, values ensuite —
    # sur volume persistant l'entrypoint ne recrée jamais le rôle.
    password: ""
  backup:
    # Sidecar dans le pod (modèle jobchef/previly), partageant image, script
    # et bucket avec postgresBackup. À activer AVANT serveApp : le serveur 18
    # doit être sauvegardé dès qu'il porte des données.
    enabled: true
  persistence:
    size: 8Gi
    # Vide = StorageClass par défaut du cluster. Épinglé dans les values
    # d'environnement si le cluster en a plusieurs marquées default.
    storageClass: ""
  nodeSelector: {}
  readinessTimeoutSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"

seaweedfs:
  enabled: true

  # OBLIGATOIRE depuis le chart 4.41.0. 4.41.0 est passé de `seaweedfs.name` à
  # `seaweedfs.componentName`, bâti sur `<Release.Name>-seaweedfs` : sans cette
  # ligne TOUS les objets sont renommés, les PVC deviennent orphelins, et
  # `spec.selector` d'un StatefulSet étant immuable, l'upgrade échoue.
  fullnameOverride: "seaweedfs"

  global:
    createClusterRole: true
    serviceAccountName: "seaweedfs"
    registry: ghcr.io/qalita
    # PAS de `repository:` ici. La clé existait et n'a JAMAIS rien fait : en
    # chart 4.0.380 le helper d'image ne la lisait pas (c'était même écrit dans
    # .github/workflows/mirror-images.yml). Le chart 4.41.0 la RESSUSCITE via
    # son shim de compatibilité (_compat.tpl:27-31), et elle rend alors
    # `ghcr.io/qalita/seaweedfs/seaweedfs:4.41` — chemin doublé, image
    # inexistante, sans la moindre erreur au rendu. Mesuré le 2026-08-16.
    imagePullSecrets: "qalita-platform-dockerregistry"
    imageName: seaweedfs

  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: "seaweedfs-s3-secret"

  filer:
    data:
      type: "persistentVolumeClaim"
      size: "4Gi"

    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: "seaweedfs-s3-secret"

    resources:
      requests:
        memory: "100Mi"
        cpu: "50m"

  volume:
    dataDirs:
      - name: data1
        type: "persistentVolumeClaim"
        size: "32Gi"
        maxVolumes: 0

    resources:
      requests:
        memory: "100Mi"
        cpu: "50m"

  master:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"

redirect:
  enabled: false

# HTTP to HTTPS redirect configuration
httpRedirect:
  enabled: false
  frontend:
    enabled: true
    annotations: {}
  api:
    enabled: true
    annotations: {}
  doc:
    enabled: true
    annotations: {}

helmsync:
  enabled: false
  image:
    repository: alpine/helm

  kubeconfig: |-
    apiVersion: v1
    kind: Config
    clusters:
    - name: "<kubernetes_cluster_name>"
      cluster:
        server: "<kubernetes_api_server_url>"
    users:
    - name: "<kubernetes_cluster_name>-user"
      user:
        token: "<kubernetes_cluster_token>"
    contexts:
    - name: "<kubernetes_cluster_name>-context"
      context:
        user: "<kubernetes_cluster_name>-user"
        cluster: "<kubernetes_cluster_name>"
    current-context: "<kubernetes_cluster_name>-context"

  resources:
    requests:
      memory: "50Mi"
      cpu: "10m"
