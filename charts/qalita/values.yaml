# For private GHCR images: set to a GitHub username (or token username) and PAT with read:packages.
licenseUser: "unlicenced"
licenseKey: "unlicenced"
# Docker registry hostname for imagePullSecret (.dockerconfigjson "auths" key). Use ghcr.io for GitHub Container Registry.
licenseUrl: ghcr.io

cluster:
  issuer: letsencrypt-prod
  domain: example.com
  name: local

# Adds a random rollme annotation to pods: every helm upgrade forces a rollout.
# Enable only on environments tracking mutable image tags (e.g. :dev).
# Fuseau horaire injecté dans les conteneurs applicatifs (TZ), pour que les
# horodatages lus par un humain suivent l'heure locale au lieu d'UTC. Un
# conteneur hérite de l'horloge de son nœud mais jamais de son fuseau : sans
# cette valeur, la libc résout UTC. PostgreSQL en est exclu à dessein (voir
# qalita.timezoneEnv dans _helpers.tpl). Mettre "" pour rester en UTC.
timezone: "Europe/Paris"

forceRedeploy: false

dockerregistry:
  enabled: true
  deploySecret: true

frontend:
  image:
    repository: ghcr.io/qalita/platform-frontend
    tag: "2.18.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  telemetryDisabled: "1"
  webPackPolling: "false"
  mode: "production"

  service:
    type: ClusterIP
    targetPort: "3000"
    protocol: TCP

  ingress:
    enabled: true
    tls:
      enabled: true

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "50m"

    extraEnv: []

doc:
  enabled: true
  image:
    repository: ghcr.io/qalita/documentation
    tag: "2.18.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    targetPort: "80"
    protocol: TCP

  ingress:
    enabled: true
    tls:
      enabled: true

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "50m"

backend:
  image:
    repository: ghcr.io/qalita/platform-backend
    tag: "2.18.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  organization:
    name: "local"

  RetentionLogsHours: 720
  AUTHTokenExpireMinutes: 240
  APItokenExpireMinutes: 525600
  mode: "PROD"
  iniSleep: "3"

  authMode: "table"
  # API surfaces mounted by the backend: "dual" (v1/v2 for the workers + v3
  # for the frontend, the only mode a 3.x frontend works with), "legacy"
  # (v1/v2 only, 2.x behaviour) or "v3". Backend >= 3.0.0 already defaults to
  # dual; the chart sets it explicitly so an image-tag bump never ends on a
  # backend that cannot serve the frontend's /api/v3/session.
  apiMode: "dual"
  adminUsername: "admin"
  adminPassword:
  secretKey:
  secretKeyAlgorithm: "HS256"

  mail:
    enabled: false
    username: ""
    password: ""
    from: "no-reply@example.com"
    from_name: "QALITA Platform"
    port: 1025
    server: ""
    starttls: false
    ssl_tls: false

  s3:
    url: "http://seaweedfs-s3:8333"
    secretName: seaweedfs-s3-secret
    admin_access_key_id: ""
    admin_secret_access_key: ""
    read_access_key_id: ""
    read_secret_access_key: ""

  startupProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 10
    timeoutSeconds: 5

  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 60
    failureThreshold: 3
    timeoutSeconds: 15

  api:
    port: "3080"
    host: "0.0.0.0"
    worker: 4
    timeout: 120

  service:
    type: ClusterIP
    targetPort: "3080"
    protocol: TCP

  grpc:
    enabled: true
    port: 50051
    protocol: TCP
    ingress:
      enabled: false
      tls:
        enabled: true
      annotations: {}

  ingress:
    enabled: true
    tls:
      enabled: true

  # Extra CA certificates trusted for outbound TLS: private LLM endpoint,
  # TLS-intercepting proxy, internal PKI. Create a Secret whose keys are PEM
  # files named *.crt or *.pem, then set existingSecret:
  #   kubectl create secret generic qalita-ca-bundle \
  #     --from-file=chu-root.crt --from-file=chu-intermediate.crt
  # They are merged with the public CA bundle at container startup, so public
  # CAs stay trusted (license registry, Stripe, cloud LLM providers).
  caBundle:
    existingSecret: ""
    mountPath: /etc/qalita/ca-certificates

  deployment:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "4Gi"
        cpu: "1000m"

    extraEnv: []
    extraVolumes: []
    extraVolumeMounts: []

worker:
  enabled: false
  privileged: false
  name: "worker"
  mode: "worker"
  token: "changeme"

  image:
    # Repo renamed qalita-cli -> cli on 2026-07-12. Releases now ship under
    # ghcr.io/qalita/cli (first one 2.16.4), which is also what the client
    # registry mirrors, so the default follows the current package.
    repository: ghcr.io/qalita/cli
    tag: "2.18.4"
    pullPolicy: IfNotPresent

  replicaCount: 1

  pvc:
    enabled: false
    storageSize: "10Gi"

  initscript: |
    #!/bin/bash
    echo "Worker agent starting..."
    qalita worker login

  deployment:
    resources:
      requests:
        memory: "50Mi"
        cpu: "10m"

    extraEnv: []

postgresql:
  enabled: true
  image:
    registry: ghcr.io/qalita
    repository: postgresql
    pullSecrets:
      - "qalita-platform-dockerregistry"
    tag: "15.4.0"

  global:
    postgresql:
      auth:
        database: qalitadb
        username: qalita
        password:

  primary:
    persistence:
      size: 8Gi

  # Clé du sous-chart BITNAMI, jamais câblée à rien de fonctionnel dans ce
  # chart. Conservée uniquement parce que le sous-chart la lit. DÉCISION DU
  # PROPRIÉTAIRE (2026-08-17) : pas de sauvegarde logique planifiée pour
  # QALITA — la couverture est la sauvegarde Longhorn nocturne du PVC, dont la
  # restauration est un chemin exercé (le volume de prod en service est
  # lui-même issu d'une restauration Longhorn, qalita-pg-restore-0716). Le
  # dump de la migration 15 -> 18 est un geste one-shot, cf. README.
  backup:
    enabled: false
    cronjob:
      storage:
        resourcePolicy: "keep"

# PostgreSQL 18 maison — phase 11 : sortie du sous-chart bitnami. Côte-à-côte
# avec lui : propre StatefulSet, Service, secret et volume, il ne touche à rien
# de ce que bitnami possède. PAS de sidecar de sauvegarde — décision du
# propriétaire (2026-08-17) : la couverture de ces bases est la sauvegarde
# Longhorn nocturne du PVC, chemin de restauration exercé. Séquence de
# migration (phase 11c) :
#   0. filet : snapshot/backup Longhorn du PVC bitnami juste avant
#   1. postgres18.enabled: true          -> le serveur 18 démarre, vide
#   2. GELER LES ÉCRITURES : backend et worker à l'échelle 0, et les y laisser
#      jusqu'à la fin de l'étape 3. Ce n'est pas une précaution de confort,
#      c'est ce qui rend le dump exact ET ce qui empêche une double écriture :
#      le déploiement du backend est en RollingUpdate par défaut (aucune
#      `strategy` déclarée), donc à la bascule l'ANCIEN pod — encore branché
#      sur bitnami — et le NOUVEAU — branché sur le 18 — coexistent le temps du
#      rollout. Sans gel, les écritures de cette fenêtre se répartissent entre
#      DEUX bases, et aucune des deux n'est ensuite complète.
#   3. dump/restore ONE-SHOT (jamais pg_upgrade), app toujours à 0 :
#        kubectl exec <pod bitnami> -- pg_dump --no-owner --no-acl … \
#          | kubectl exec -i <pod postgres18> -- psql …
#      Restaurer sous `psql -v ON_ERROR_STOP=1` : sans lui psql avale les
#      erreurs et rend une base à moitié peuplée qui a l'air correcte.
#      Vérifier ensuite les comptes de lignes TABLE PAR TABLE contre la source
#      — un simple compte de tables ne prouve rien (chez previly, un backend
#      transitoire avait semé un schéma-leurre au bon nombre de tables, toutes
#      vides, qui a failli passer pour la restauration).
#   4. postgres18.serveApp: true         -> le backend bascule (repointage),
#      puis re-scaler l'application et vérifier.
#   5. sous-chart bitnami à l'échelle 0, volume INTACT plusieurs jours
#   6. postgresql.enabled: false         -> seulement après période nominale
# Retour arrière jusqu'à l'étape 5 : serveApp false — l'ancien serveur n'a
# jamais bougé. APRÈS l'étape 6 il en faut DEUX (postgresql.enabled=true ET
# serveApp=false) ; la garde du gabarit backend refuse la moitié du geste.
postgres18:
  enabled: false
  # true = le backend vise qalita-postgres18 (service et secret) au lieu du
  # sous-chart bitnami. C'est LA bascule, et c'est aussi le retour arrière.
  serveApp: false
  image:
    # Miroir GHCR de library/postgres:18-alpine (mirror-images.yml) — la
    # décision de source que mirror-images.yml renvoyait « au chantier
    # PostgreSQL dédié » est ici : l'image officielle, pas bitnami, comme
    # jobchef et previly.
    #
    # ALPINE = MUSL, ET C'EST UN CHANGEMENT DE COLLATION : le serveur bitnami
    # actuel est glibc (datcollate en_US.UTF-8, tri linguistique), musl traite
    # les locales en ordre octet. Mesuré sur la base de prod avant l'arbitrage :
    # ZÉRO colonne à collation explicite (rien n'échoue au restore) et 151
    # colonnes texte dont seul l'ordre de tri des accents change en ORDER BY —
    # cosmétique. Pas de risque de corruption : la migration est un
    # dump/restore, les index sont reconstruits sur la cible. previly et
    # jobchef tournent déjà en alpine/musl en production. Si un tri
    # linguistique devenait nécessaire un jour : ICU par colonne, pas un
    # changement d'image.
    repository: ghcr.io/qalita/postgres
    tag: "18-alpine"
    pullPolicy: IfNotPresent
  auth:
    # Vide = généré au premier déploiement puis préservé
    # (qalita.preservedSecret). Rotation : ALTER ROLE d'abord, values ensuite —
    # sur volume persistant l'entrypoint ne recrée jamais le rôle.
    #
    # PRIVILÈGES, À SAVOIR : l'entrypoint de library/postgres crée
    # POSTGRES_USER en SUPERUSER — sur le 18, le rôle applicatif `qalita` est
    # donc superuser, là où bitnami le créait en simple propriétaire de base à
    # côté d'un rôle postgres séparé. C'est le modèle de previly et jobchef en
    # production (un seul rôle, superuser, base par namespace jamais exposée
    # hors cluster) ; l'adopter ici est un choix d'uniformité assumé, pas un
    # oubli. Si un rôle applicatif non privilégié devient souhaitable, c'est
    # un script docker-entrypoint-initdb.d au PREMIER démarrage — pas un
    # réglage de values après coup.
    password: ""
  persistence:
    # IMMUABLE APRÈS LE PREMIER DÉPLOIEMENT : cette taille vit dans les
    # volumeClaimTemplates du StatefulSet, que Kubernetes refuse de modifier.
    # La changer ici ferait échouer tout helm upgrade de la release. La
    # procédure d'agrandissement est manuelle et dans cet ordre :
    #   1. kubectl patch pvc data-qalita-postgres18-0 (expansion en ligne)
    #   2. kubectl delete sts qalita-postgres18 --cascade=orphan
    #   3. helm upgrade avec la nouvelle valeur (recrée le StatefulSet)
    # Dimensionner large dès le départ coûte moins cher que cette gymnastique
    # — cf. l'incident SeaweedFS du 2026-08-17 pour ce que les
    # volumeClaimTemplates font aux upgrades.
    size: 8Gi
    # Vide = StorageClass par défaut du cluster. Épinglé dans les values
    # d'environnement si le cluster en a plusieurs marquées default.
    storageClass: ""
  nodeSelector: {}
  readinessTimeoutSeconds: 5
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"

seaweedfs:
  enabled: true

  # OBLIGATOIRE depuis le chart 4.41.0. 4.41.0 est passé de `seaweedfs.name` à
  # `seaweedfs.componentName`, bâti sur `<Release.Name>-seaweedfs` : sans cette
  # ligne TOUS les objets sont renommés, les PVC deviennent orphelins, et
  # `spec.selector` d'un StatefulSet étant immuable, l'upgrade échoue.
  fullnameOverride: "seaweedfs"

  global:
    createClusterRole: true
    serviceAccountName: "seaweedfs"
    registry: ghcr.io/qalita
    # PAS de `repository:` ici. La clé existait et n'a JAMAIS rien fait : en
    # chart 4.0.380 le helper d'image ne la lisait pas (c'était même écrit dans
    # .github/workflows/mirror-images.yml). Le chart 4.41.0 la RESSUSCITE via
    # son shim de compatibilité (_compat.tpl:27-31), et elle rend alors
    # `ghcr.io/qalita/seaweedfs/seaweedfs:4.41` — chemin doublé, image
    # inexistante, sans la moindre erreur au rendu. Mesuré le 2026-08-16.
    imagePullSecrets: "qalita-platform-dockerregistry"
    imageName: seaweedfs

  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: "seaweedfs-s3-secret"

  filer:
    data:
      type: "persistentVolumeClaim"
      size: "4Gi"

    s3:
      enabled: true
      enableAuth: true
      existingConfigSecret: "seaweedfs-s3-secret"

    resources:
      requests:
        memory: "100Mi"
        cpu: "50m"

  volume:
    dataDirs:
      - name: data1
        type: "persistentVolumeClaim"
        size: "32Gi"
        maxVolumes: 0

    resources:
      requests:
        memory: "100Mi"
        cpu: "50m"

  master:
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"

redirect:
  enabled: false

# HTTP to HTTPS redirect configuration
httpRedirect:
  enabled: false
  frontend:
    enabled: true
    annotations: {}
  api:
    enabled: true
    annotations: {}
  doc:
    enabled: true
    annotations: {}

helmsync:
  enabled: false
  image:
    repository: alpine/helm

  kubeconfig: |-
    apiVersion: v1
    kind: Config
    clusters:
    - name: "<kubernetes_cluster_name>"
      cluster:
        server: "<kubernetes_api_server_url>"
    users:
    - name: "<kubernetes_cluster_name>-user"
      user:
        token: "<kubernetes_cluster_token>"
    contexts:
    - name: "<kubernetes_cluster_name>-context"
      context:
        user: "<kubernetes_cluster_name>-user"
        cluster: "<kubernetes_cluster_name>"
    current-context: "<kubernetes_cluster_name>-context"

  resources:
    requests:
      memory: "50Mi"
      cpu: "10m"
